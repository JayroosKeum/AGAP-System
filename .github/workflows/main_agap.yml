# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Deploy AGAP to Azure App Service

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Verify PHP entry points
        run: |
          php -l index.php
          php -l frontend/pages/landing/index.php

      # Deploy only application code. Runtime files are kept on the mounted
      # Azure Files share at /home/site/wwwroot/storage and must survive releases.
      - name: Assemble release package
        run: |
          mkdir -p release
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='storage/' \
            --exclude='logs/' \
            --exclude='output/' \
            --exclude='scratch/' \
            --exclude='*.md' \
            --exclude='*.pdf' \
            --exclude='*.xlsx' \
            --exclude='default' \
            ./ release/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_49F63E697029412686408871AA88CF9E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DFC2C15D65784E45A8ED28731128DA80 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BFA18332F3314BB2B3975BC75386ABD2 }}

      - name: Deploy release package to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AGAP'
          slot-name: 'Production'
          package: release
