# AGAP Azure App Service (Nginx) security and upload limits.
# Included inside the default Nginx server block by azure/startup.sh.

client_max_body_size 32M;

# Match .htaccess clean URLs for staff verification and activation links.
location = /activate {
    rewrite ^ /activate.php last;
}

location = /verify-email {
    rewrite ^ /verify-email.php last;
}

# Block direct web access to internal backend code, database scripts, and sensitive files.
location ~ ^/backend/(?!api/) {
    deny all;
    return 403;
}

location ~ ^/database/ {
    deny all;
    return 403;
}

location ~ (^|/)\. {
    deny all;
    return 403;
}

location ~* ^/(composer\.(json|lock)|package(-lock)?\.json)$ {
    deny all;
    return 403;
}

location ~* \.(sql|log|ini|bak|env|md)$ {
    deny all;
    return 403;
}
